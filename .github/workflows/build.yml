name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -o MyraAI_Project.zip
      - name: Build
        run: gradle assembleDebug --stacktrace
        working-directory: MyraAI_Project
      - uses: actions/upload-artifact@v4
        with:
          name: MyraAI-debug-apk
          path: MyraAI_Project/app/build/outputs/apk/debug/*.apk
